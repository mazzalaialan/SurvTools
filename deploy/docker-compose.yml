# Herramientas de Supervivencia por VikArg autoalojado con HTTPS automático (Caddy + Let's Encrypt).
# Uso: copiar .env.example a .env, completar DOMAIN, y correr
#   docker compose up -d --build
# Guía completa: docs/SERVIDOR.md

services:
  vikarg:
    build:
      context: ..
    image: vikarg-survival:latest
    restart: unless-stopped
    environment:
      # Contacto que exige Web Push: un mailto: o, si no se quiere dar un mail, la URL del servidor.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${DOMAIN}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TRANSFER_MAX_MB: ${TRANSFER_MAX_MB:-50}
      MAPS_DIR: /maps
      # Base de calles, números de puerta y kilómetros (tools/osm-index); sin el archivo, «Mi ubicación» usa los servicios públicos.
      OSM_INDEX: /osm/around.sqlite
      LIBRARY_DIR: /library
      DATA_PACKS_DIR: /packs
      # Clave de la biblioteca: la misma con la que se cifraron los libros con derechos (tools/library-builder).
      LIBRARY_KEY: ${LIBRARY_KEY:-}
      # Aviso por mail cuando una fuente externa no responde (ver docs/SERVIDOR.md).
      SMTP_URL: ${SMTP_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-contacto.vikarg@gmail.com}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      # Clave de la API del IOC (mareógrafos medidos); vacía, esa función queda apagada.
      IOC_API_KEY: ${IOC_API_KEY:-}
      # Copia propia de Open-Meteo (servicios `openmeteo` y `openmeteo-sync`): primera opción para el clima; si no responde, el servicio público.
      OPEN_METEO_LOCAL_URL: ${OPEN_METEO_LOCAL_URL:-http://openmeteo:8080}
      OPEN_METEO_ARCHIVE_FROM: ${OPEN_METEO_ARCHIVE_FROM:-2020}
      # Avisos a la app nativa por Firebase (FCM): ruta, dentro del contenedor, de la cuenta de servicio (secreto, fuera del repositorio). Vacío = apagado.
      FCM_SERVICE_ACCOUNT_FILE: ${FCM_SERVICE_ACCOUNT_FILE:-}
    volumes:
      - vikarg-data:/data
      # Mapas offline (vector.pmtiles y elevation.pmtiles); vacía, la app usa las fuentes públicas. Ver docs/SERVIDOR.md.
      - ${MAPS_PATH:-./maps}:/maps:ro
      # Base de calles y números de OpenStreetMap (around.sqlite); la arma tools/osm-index/build.sh. Vacía, no se usa.
      - ${OSM_INDEX_PATH:-./osm}:/osm:ro
      # Paquetes de la biblioteca (catalog.json y books/), los que arma tools/library-builder (run.sh package).
      - ${LIBRARY_PATH:-./library}:/library:ro
      # Paquetes de datos que se regeneran cada mes (server/src/data/update-data.sh, por cron).
      - ${DATA_PACKS_PATH:-./data-packs}:/packs:ro

  # Open-Meteo propio (AGPL-3.0): sirve la API desde datos de la región bajados del bucket público de Open-Meteo. Solo lo ve el servidor
  # VikArg por la red interna (no se publica ningún puerto); la app lo usa a través de /api/om. Ver docs/SERVIDOR.md.
  openmeteo:
    image: ${OPEN_METEO_IMAGE:-ghcr.io/open-meteo/open-meteo@sha256:bf94e8b39761b59a91bd04bb926b3834cad00eaf71f1aa64b2fd17fbe987846a}
    restart: unless-stopped
    user: "0:0"
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    volumes:
      - ${OPEN_METEO_PATH:-./openmeteo-data}:/app/data:ro

  # Mantiene al día los datos de `openmeteo` (pronóstico cada hora, historial una vez por día); ver openmeteo/sync.sh.
  openmeteo-sync:
    image: ${OPEN_METEO_IMAGE:-ghcr.io/open-meteo/open-meteo@sha256:bf94e8b39761b59a91bd04bb926b3834cad00eaf71f1aa64b2fd17fbe987846a}
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/bash", "/sync.sh"]
    environment:
      OPEN_METEO_ARCHIVE_FROM: ${OPEN_METEO_ARCHIVE_FROM:-2020}
    volumes:
      - ${OPEN_METEO_PATH:-./openmeteo-data}:/app/data
      - ./openmeteo/sync.sh:/sync.sh:ro
      - ./openmeteo/region.json:/region.json:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - vikarg

volumes:
  vikarg-data:
  caddy-data:
